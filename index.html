<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ভিডিও লাইব্রেরি</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .player-wrapper {
      flex: 1;
      overflow: auto;
      padding: 20px;
    }

    #playerArea {
      display: flex;
      justify-content: center;
    }

    .video-info {
      padding: 16px;
      border-top: 1px solid #333;
      background: #111827;
    }

    .video-info h2 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.4;
    }

    .video-info p {
      margin: 0;
      opacity: 0.8;
      font-size: 14px;
      line-height: 1.5;
    }

    .sidebar {
      width: 420px;
      overflow-y: auto;
      background: #1f2937;
      border-left: 1px solid #374151;
    }

    .topbar {
      position: sticky;
      top: 0;
      background: #1f2937;
      padding: 12px;
      border-bottom: 1px solid #374151;
      z-index: 10;
    }

    .search {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      outline: none;
    }

    details {
      border-bottom: 1px solid #374151;
    }

    summary {
      padding: 14px 16px;
      cursor: pointer;
      font-weight: bold;
      background: #243041;
    }

    .subcategory {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: bold;
      background: #18212f;
      color: #cbd5e1;
    }

    .video-item {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      border-top: 1px solid #2d3748;
      transition: 0.15s;
    }

    .video-item:hover {
      background: #334155;
    }

    .video-item.active {
      background: #475569;
    }

    .video-checkbox {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      accent-color: #22c55e;
      flex-shrink: 0;
    }

    .video-content {
      flex: 1;
    }

    .video-title {
      font-size: 14px;
      line-height: 1.45;
      margin-bottom: 4px;
    }

    .video-subtitle {
      font-size: 12px;
      opacity: 0.7;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      gap: 10px;
      padding: 10px 20px;
      border-top: 1px solid #222;
      background: #0f172a;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #374151;
      color: white;
    }

    button:hover {
      background: #4b5563;
    }

    @media (max-width: 900px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 45vh;
      }

      .left {
        height: 55vh;
      }
    }
  </style>
</head>
<body>

<div id="fb-root"></div>

<div class="app">

  <div class="left">

    <div class="player-wrapper">
      <div id="playerArea"></div>
    </div>

    <div class="controls">
      <button onclick="playVideo()">Play</button>
      <button onclick="pauseVideo()">Pause</button>
      <button onclick="seekVideo()">Seek 10s</button>
    </div>

    <div class="video-info">
      <h2 id="videoTitle">ভিডিও নির্বাচন করুন</h2>
      <p id="videoSubtitle"></p>
    </div>

  </div>

  <div class="sidebar">

    <div class="topbar">
      <input
        id="searchInput"
        class="search"
        placeholder="সার্চ করুন..."
      />
    </div>

    <div id="categories"></div>

  </div>

</div>

<script>
const CSV_URL = "./data.csv";

const categoriesEl = document.getElementById("categories");
const searchInput = document.getElementById("searchInput");
const playerArea = document.getElementById("playerArea");
const videoTitle = document.getElementById("videoTitle");
const videoSubtitle = document.getElementById("videoSubtitle");

let allVideos = [];
let currentVideo = null;
let currentPlayer = null;

function sanitizeUrl(url) {
  if (!url) return "";

  url = url.trim();

  if (!url.startsWith("http://") && !url.startsWith("https://")) {
    url = "https://" + url;
  }

  try {
    return new URL(url).toString();
  } catch {
    return "";
  }
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let current = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"') {
      if (insideQuotes && next === '"') {
        current += '"';
        i++;
      } else {
        insideQuotes = !insideQuotes;
      }
    } else if (char === "," && !insideQuotes) {
      row.push(current);
      current = "";
    } else if ((char === "\n" || char === "\r") && !insideQuotes) {
      if (current || row.length) {
        row.push(current);
        rows.push(row);
        row = [];
        current = "";
      }
    } else {
      current += char;
    }
  }

  if (current || row.length) {
    row.push(current);
    rows.push(row);
  }

  return rows;
}

function getDoneVideos() {
  try {
    return JSON.parse(localStorage.getItem("doneVideos") || "[]");
  } catch {
    return [];
  }
}

function setDoneVideos(arr) {
  localStorage.setItem("doneVideos", JSON.stringify(arr));
}

function toggleDone(link, checked) {
  const done = getDoneVideos();

  if (checked) {
    if (!done.includes(link)) done.push(link);
  } else {
    const idx = done.indexOf(link);
    if (idx !== -1) done.splice(idx, 1);
  }

  setDoneVideos(done);
}

function renderFBVideo(url) {
  playerArea.innerHTML = `
    <div
      class="fb-video"
      data-href="${url}"
      data-width="800"
      data-allowfullscreen="true">
    </div>
  `;

  currentPlayer = null;

  FB.XFBML.parse(playerArea);

  FB.Event.subscribe("xfbml.ready", function(msg) {
    if (msg.type === "video") {
      currentPlayer = msg.instance;
    }
  });
}

function playItem(video) {
  currentVideo = video;

  const cleanUrl = sanitizeUrl(video.link);

  renderFBVideo(cleanUrl);

  videoTitle.textContent = video.title;
  videoSubtitle.textContent = video.subtitle || "";

  renderVideos(allVideos, searchInput.value);
}

function playVideo() {
  if (currentPlayer) currentPlayer.play();
}

function pauseVideo() {
  if (currentPlayer) currentPlayer.pause();
}

function seekVideo() {
  if (currentPlayer) currentPlayer.seek(10);
}

function renderVideos(videos, search = "") {
  categoriesEl.innerHTML = "";

  const doneVideos = getDoneVideos();

  const filtered = videos.filter(v => {
    const text = (
      v.title +
      " " +
      v.subtitle +
      " " +
      v.category +
      " " +
      v.subcategory
    ).toLowerCase();

    return text.includes(search.toLowerCase());
  });

  const grouped = {};

  filtered.forEach(video => {
    const cat = video.category || "অন্যান্য";
    const sub = video.subcategory || "সাধারণ";

    if (!grouped[cat]) grouped[cat] = {};
    if (!grouped[cat][sub]) grouped[cat][sub] = [];

    grouped[cat][sub].push(video);
  });

  Object.entries(grouped).forEach(([category, subcats]) => {

    const details = document.createElement("details");
    details.open = true;

    const summary = document.createElement("summary");
    summary.textContent = category;

    details.appendChild(summary);

    Object.entries(subcats).forEach(([subcat, videos]) => {

      if (subcat !== "সাধারণ") {
        const subEl = document.createElement("div");
        subEl.className = "subcategory";
        subEl.textContent = subcat;
        details.appendChild(subEl);
      }

      videos.forEach(video => {

        const item = document.createElement("div");
        item.className = "video-item";

        if (currentVideo && currentVideo.link === video.link) {
          item.classList.add("active");
        }

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "video-checkbox";
        checkbox.checked = doneVideos.includes(video.link);

        checkbox.addEventListener("click", e => {
          e.stopPropagation();
          toggleDone(video.link, checkbox.checked);
        });

        const content = document.createElement("div");
        content.className = "video-content";

        const title = document.createElement("div");
        title.className = "video-title";
        title.textContent = video.title;

        const subtitle = document.createElement("div");
        subtitle.className = "video-subtitle";
        subtitle.textContent = video.subtitle || "";

        content.appendChild(title);
        content.appendChild(subtitle);

        item.appendChild(checkbox);
        item.appendChild(content);

        item.addEventListener("click", () => {
          playItem(video);
        });

        details.appendChild(item);
      });
    });

    categoriesEl.appendChild(details);
  });
}

async function loadCSV() {
  const res = await fetch(CSV_URL);
  const text = await res.text();

  const rows = parseCSV(text);

  const headers = rows[0].map(h => h.trim());

  allVideos = rows.slice(1)
    .filter(r => r.length >= 3)
    .map(row => {
      const obj = {};

      headers.forEach((h, i) => {
        obj[h] = (row[i] || "").trim();
      });

      return obj;
    });

  renderVideos(allVideos);

  if (allVideos[0]) {
    playItem(allVideos[0]);
  }
}

searchInput.addEventListener("input", e => {
  renderVideos(allVideos, e.target.value);
});

window.fbAsyncInit = function () {
  FB.init({
    appId: "1061942345656893",
    xfbml: true,
    version: "v19.0"
  });

  loadCSV();
};

(function(d, s, id) {
  let js, fjs = d.getElementsByTagName(s)[0];

  if (d.getElementById(id)) return;

  js = d.createElement(s);
  js.id = id;
  js.src = "https://connect.facebook.net/en_US/sdk.js";

  fjs.parentNode.insertBefore(js, fjs);
}(document, "script", "facebook-jssdk"));
</script>

</body>
</html>
